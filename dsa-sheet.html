<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Ultimate DSA Sheet</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--fg:#14171f;--mut:#6b7280;--line:#e3e6ec;--acc:#2f6bff;--ok:#15803d;--okbg:#e9f6ed;
--ez:#0e7a5f;--me:#a86300;--hd:#c0392b;--chip:#eef1f6;--star:#e0a300;--hot:#d4380d}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1117;--card:#161b22;--fg:#e6edf3;--mut:#9099a6;
--line:#262d38;--acc:#5b8cff;--ok:#4ade80;--okbg:#15301f;--ez:#3fb98a;--me:#e0a94a;--hd:#f0736a;--chip:#222934;--star:#f0c23c;--hot:#ff8f6b}}
:root[data-theme="dark"]{--bg:#0e1117;--card:#161b22;--fg:#e6edf3;--mut:#9099a6;--line:#262d38;--acc:#5b8cff;--ok:#4ade80;
--okbg:#15301f;--ez:#3fb98a;--me:#e0a94a;--hd:#f0736a;--chip:#222934;--star:#f0c23c;--hot:#ff8f6b}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 140px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:16px 13px 80px}
h1{font-size:21px;margin:0 0 2px;letter-spacing:-.3px}
.sub{color:var(--mut);font-size:12.5px;margin-bottom:12px}
.bar{height:9px;background:var(--chip);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:9px 0 2px;font-size:12px;color:var(--mut)}.stats b{color:var(--fg)}
.ctrl{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding:9px 0 8px;border-bottom:1px solid var(--line);margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
input[type=search],select{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:14px;font-family:inherit}
input[type=search]{flex:1;min-width:160px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:99px;padding:5px 11px;font-size:12.5px;cursor:pointer;font-family:inherit}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.grp{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:10px;overflow:hidden}
.ghead{display:flex;gap:10px;align-items:center;padding:11px 13px;cursor:pointer;user-select:none}
.ghead h2{font-size:14.5px;margin:0;flex:1;font-weight:600}
.ghead small{color:var(--mut);font-size:11.5px;white-space:nowrap}
.mini{width:58px;height:6px;background:var(--chip);border-radius:99px;overflow:hidden;flex:none}.mini>i{display:block;height:100%;background:var(--ok)}
.note{font-size:12.5px;color:var(--mut);padding:0 13px 10px;border-bottom:1px solid var(--line);line-height:1.55}
.note b{color:var(--fg);font-weight:600}
.pre{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:5px}
.pre em{font-style:normal;font-size:11px;color:var(--mut)}
.pl{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;cursor:pointer;background:var(--chip);color:var(--fg)}
.topic{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:10px 13px 4px}
.p{display:flex;gap:8px;align-items:flex-start;padding:8px 13px;border-top:1px solid var(--line);flex-wrap:wrap}
.p.done{background:var(--okbg)}
.cb{width:17px;height:17px;margin-top:3px;accent-color:var(--ok);flex:none;cursor:pointer}
.meta{flex:1;min-width:200px}.ttl{font-weight:500;font-size:14.5px}.p.done .ttl{text-decoration:line-through;opacity:.6}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;align-items:center}
.pill{font-size:10.5px;border-radius:5px;padding:2px 6px;background:var(--chip);color:var(--mut);font-weight:600}
.Easy{color:var(--ez)}.Medium{color:var(--me)}.Hard{color:var(--hd)}
.pat{background:transparent;border:1px solid var(--acc);color:var(--acc);cursor:pointer;font-family:inherit}
.co{background:var(--acc);color:#fff}.co.hot{background:var(--hot)}
.sde{border:1px solid var(--line)}
.links{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.lk{font-size:11.5px;text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:3px 8px;color:var(--fg);background:var(--card);white-space:nowrap}
.lk:hover{border-color:var(--acc);color:var(--acc)}
.star{border:0;background:none;font-size:16px;cursor:pointer;color:var(--line);padding:2px;line-height:1}
.star[aria-pressed=true]{color:var(--star)}
.foot{color:var(--mut);font-size:11.5px;margin-top:16px;line-height:1.7}
.empty{padding:26px;text-align:center;color:var(--mut)}
@media(max-width:560px){.wrap{padding:13px 9px 70px}.meta{min-width:100%}}
</style></head><body><div class="wrap">
<a href="index.html" style="color:var(--mut);font-size:12.5px;text-decoration:none">← Ultimate SDE Prep Hub</a>
<h1 style="margin-top:8px">The Ultimate DSA Sheet</h1>
<div class="sub" id="sub"></div>
<div class="bar"><i id="pb"></i></div><div class="stats" id="stats"></div>
<div class="ctrl">
<div class="row">
<input type="search" id="q" placeholder="Search problem, pattern, topic, company…">
<select id="gby"><option value="step">Group: A2Z step</option><option value="pat">Group: pattern</option>
<option value="grp">Group: pattern family</option><option value="co">Group: company</option><option value="d">Group: difficulty</option></select>
<select id="fstat"><option value="">All</option><option value="todo">Unsolved</option><option value="done">Solved</option><option value="rev">Starred</option></select>
</div>
<div class="row" style="margin-top:6px" id="lchips"></div>
<div class="row" style="margin-top:5px" id="cchips"></div>
<div class="row" style="margin-top:5px">
<button class="chip" data-d="Easy">Easy</button><button class="chip" data-d="Medium">Medium</button><button class="chip" data-d="Hard">Hard</button>
<button class="chip" id="hotOnly">Asked in last 6 months</button><button class="chip" id="sdeOnly">SDE 191</button>
<span style="flex:1"></span><button class="chip" id="exp">Export</button><button class="chip" id="imp">Import</button><button class="chip" id="thm">Theme</button>
</div></div>
<div id="list"></div><div class="foot" id="foot"></div></div>
<script>
const D={"meta":{"total":1698,"layers":{"core":420,"company":768,"cses":300,"cf":210},"companies":["Uber","Google","Meta","Amazon","Apple","Netflix","Microsoft"],"generated":"2026-09-20","steps":[{"n":1,"t":"Beginner Problems","c":38},{"n":2,"t":"Sorting","c":5},{"n":3,"t":"Arrays","c":31},{"n":4,"t":"Hashing","c":5},{"n":5,"t":"Binary Search","c":31},{"n":6,"t":"Recursion","c":17},{"n":7,"t":"Linked-List","c":39},{"n":8,"t":"Bit Manipulation","c":7},{"n":9,"t":"Greedy Algorithms","c":14},{"n":10,"t":"Sliding Window / 2 Pointer","c":11},{"n":11,"t":"Stack / Queues","c":22},{"n":12,"t":"Binary Trees","c":29},{"n":13,"t":"Binary Search Trees","c":13},{"n":14,"t":"Heaps","c":9},{"n":15,"t":"Graphs","c":40},{"n":16,"t":"Dynamic Programming","c":47},{"n":17,"t":"Tries","c":6},{"n":18,"t":"Strings (Advanced Algo)","c":8},{"n":19,"t":"Maths","c":3},{"n":20,"t":"SDE Sheet — Extra Problems","c":45}],"sdeMatched":144,"a2z":402},"patterns":[{"id":"two-ptr","n":"Two Pointers","g":"Foundations","pre":[],"cx":"O(n)","cue":"Sorted array / pair-sum / dedup in place — shrink from both ends or run slow+fast on one pass.","c":40},{"id":"prefix","n":"Prefix Sum & Difference Array","g":"Foundations","pre":[],"cx":"O(n) build, O(1) query","cue":"Repeated range sums, or range-update+point-query — precompute cumulative array; 2D variant uses inclusion-exclusion.","c":11},{"id":"prefix-hash","n":"Prefix Sum + HashMap","g":"Foundations","pre":["prefix","hash-count"],"cx":"O(n)","cue":"'Count/longest subarray with sum or XOR = k' — store first index of each prefix value; answer = prefix[j]-k lookups.","c":13},{"id":"hash-count","n":"Hashing & Frequency Maps","g":"Foundations","pre":[],"cx":"O(n)","cue":"Anagram, duplicate, frequency or grouping questions — key by canonical form (sorted string, count tuple).","c":104},{"id":"sort-custom","n":"Custom Sorting & Comparators","g":"Foundations","pre":[],"cx":"O(n log n)","cue":"Order is the whole problem — define a strict weak ordering; for ties use secondary keys, for greedy proofs use exchange argument.","c":59},{"id":"bsearch","n":"Binary Search on Sorted Data","g":"Foundations","pre":[],"cx":"O(log n)","cue":"Monotone sorted input — invariant: answer always inside [lo,hi]; write it as lower_bound/upper_bound, not ad-hoc.","c":36},{"id":"bsearch-ans","n":"Binary Search on the Answer","g":"Search & Greedy","pre":["bsearch"],"cx":"O(n log(max))","cue":"'Minimise the maximum' / 'maximum minimum' / capacity, speed, time limits — predicate feasible(x) is monotone; search over value space, not indices.","c":12},{"id":"bsearch-rot","n":"Binary Search on Rotated / Unsorted Shapes","g":"Search & Greedy","pre":["bsearch"],"cx":"O(log n)","cue":"Rotated sorted array, peak element, mountain array — one half is always sorted or monotone; decide which, then recurse into it.","c":8},{"id":"sw-fixed","n":"Fixed-Size Sliding Window","g":"Foundations","pre":["hash-count"],"cx":"O(n)","cue":"'Every window of size k' — add right, remove left, keep window invariant in O(1).","c":0},{"id":"sw-var","n":"Variable-Size Sliding Window","g":"Foundations","pre":["sw-fixed"],"cx":"O(n)","cue":"'Longest/shortest subarray satisfying P' where P is monotone in window size — expand right, shrink left while invalid.","c":7},{"id":"mono-stack","n":"Monotonic Stack","g":"Stacks & Queues","pre":[],"cx":"O(n)","cue":"Next/previous greater or smaller; largest rectangle; stock span — pop while the incoming element violates the order; each index pushed and popped once.","c":35},{"id":"mono-deque","n":"Monotonic Deque","g":"Stacks & Queues","pre":["mono-stack","sw-fixed"],"cx":"O(n)","cue":"Sliding-window maximum/minimum — deque holds indices in decreasing value order; front is the answer.","c":2},{"id":"kadane","n":"Kadane / Running Optimum","g":"Foundations","pre":[],"cx":"O(n)","cue":"Max subarray sum, max product, best-time-to-buy — carry best-ending-here and best-overall; reset when the running value stops helping.","c":3},{"id":"cyclic-sort","n":"Cyclic Sort & Index-as-Hash","g":"Foundations","pre":[],"cx":"O(n), O(1) space","cue":"Values are 1..n — place each value at its index, or negate/mark visited indices to find missing, duplicate, or first-positive.","c":27},{"id":"dutch-flag","n":"Dutch National Flag / 3-way Partition","g":"Foundations","pre":["two-ptr"],"cx":"O(n)","cue":"Three categories in one pass (sort 0s/1s/2s, quickselect partition) — low/mid/high pointers.","c":1},{"id":"matrix","n":"Matrix Manipulation","g":"Foundations","pre":[],"cx":"O(mn)","cue":"Rotate, spiral, transpose, set-zeroes — either derive the index map (i,j)->(j,n-1-i) or use the first row/col as marker storage.","c":20},{"id":"bit-basics","n":"Bit Manipulation Basics","g":"Bits & Math","pre":[],"cx":"O(1)/O(32n)","cue":"Set/clear/check/lowest-set-bit (x&-x), n&(n-1) drops lowest bit; count bits per column when summing over positions.","c":2},{"id":"xor","n":"XOR Tricks","g":"Bits & Math","pre":["bit-basics"],"cx":"O(n)","cue":"Single/two/three numbers appearing once, subarray XOR — XOR is its own inverse; partition by a differing bit.","c":11},{"id":"bit-subset","n":"Subset Enumeration over Bitmasks","g":"Bits & Math","pre":["bit-basics"],"cx":"O(2^n) or O(3^n)","cue":"n<=20 — iterate masks; submask enumeration `for(s=m;s;s=(s-1)&m)` gives O(3^n) over all masks.","c":0},{"id":"fast-pow","n":"Binary Exponentiation","g":"Bits & Math","pre":["bit-basics"],"cx":"O(log n)","cue":"x^n, modular powers, or applying any associative operation n times.","c":1},{"id":"greedy","n":"Greedy + Exchange Argument","g":"Search & Greedy","pre":["sort-custom"],"cx":"O(n log n)","cue":"Local choice is provably safe — sort by the right key, then argue any optimal solution can be exchanged into yours without loss.","c":25},{"id":"intervals","n":"Interval Merging & Scheduling","g":"Search & Greedy","pre":["sort-custom"],"cx":"O(n log n)","cue":"Overlaps, merges, min rooms, max non-overlapping — sort by start (merge) or by end (max count of compatible).","c":10},{"id":"sweep","n":"Sweep Line / Event Counting","g":"Search & Greedy","pre":["intervals"],"cx":"O(n log n)","cue":"Max concurrent intervals, skyline, calendar booking — emit (+1 at start, -1 at end) events, sort, sweep a running counter.","c":2},{"id":"heap-topk","n":"Heap / Top-K","g":"Heaps","pre":[],"cx":"O(n log k)","cue":"K largest/smallest/closest, or 'process next best' — size-k heap of the opposite polarity; quickselect if strictly one-shot O(n).","c":11},{"id":"two-heaps","n":"Two Heaps (Running Median)","g":"Heaps","pre":["heap-topk"],"cx":"O(log n) per op","cue":"Median or balanced split of a stream — max-heap for the lower half, min-heap for the upper, sizes differ by <=1.","c":2},{"id":"k-way-merge","n":"K-Way Merge","g":"Heaps","pre":["heap-topk"],"cx":"O(n log k)","cue":"Merge k sorted lists/arrays, kth smallest in sorted matrix — heap of one cursor per list.","c":5},{"id":"ll-reverse","n":"Linked List Reversal","g":"Linked Lists","pre":[],"cx":"O(n), O(1) space","cue":"Reverse whole/part/in k-groups — prev/curr/next rewiring; for sublists anchor a dummy node before the segment.","c":0},{"id":"ll-slow-fast","n":"Fast & Slow Pointers","g":"Linked Lists","pre":["two-ptr"],"cx":"O(n)","cue":"Cycle detection, middle node, nth-from-end, palindrome list — Floyd's tortoise-hare; meeting point plus head gives cycle start.","c":2},{"id":"ll-merge","n":"Linked List Merge & Reorder","g":"Linked Lists","pre":["ll-reverse","ll-slow-fast"],"cx":"O(n)","cue":"Merge sorted lists, reorder, sort list — split at middle, recurse, merge with a dummy head.","c":45},{"id":"recursion","n":"Recursion & Recurrence Design","g":"Recursion","pre":[],"cx":"varies","cue":"Define f(state) precisely, trust it for subproblems, handle the base case — every later DP is a memoised version of this.","c":28},{"id":"subsets","n":"Subsets / Power Set","g":"Recursion","pre":["recursion"],"cx":"O(2^n * n)","cue":"Pick-or-skip at each index; duplicates handled by sorting and skipping equal siblings at the same depth.","c":6},{"id":"permutations","n":"Permutations","g":"Recursion","pre":["recursion"],"cx":"O(n! * n)","cue":"Swap-in-place or used[] array; next_permutation gives the O(n) lexicographic successor.","c":13},{"id":"comb-sum","n":"Combination Sum / Bounded Choice","g":"Recursion","pre":["subsets"],"cx":"O(2^n)","cue":"Unlimited reuse -> recurse on the same index; single use -> index+1; prune when the running sum exceeds target.","c":3},{"id":"backtrack-grid","n":"Grid & Constraint Backtracking","g":"Recursion","pre":["recursion"],"cx":"exponential with pruning","cue":"N-Queens, Sudoku, word search, rat in maze — mark, recurse, unmark; prune with constraint sets (cols, diagonals, seen).","c":17},{"id":"mitm","n":"Meet in the Middle","g":"Advanced Techniques","pre":["subsets","bsearch"],"cx":"O(2^(n/2) log)","cue":"n around 40 and brute force is 2^n — split in half, enumerate each, join by sorting/binary search.","c":0},{"id":"tree-traverse","n":"Tree Traversals (Rec + Iterative)","g":"Trees","pre":["recursion"],"cx":"O(n)","cue":"Preorder/inorder/postorder, level order — iterative versions use an explicit stack; know the single-traversal three-way variant.","c":43},{"id":"tree-dfs-return","n":"DFS Returning Values Upward","g":"Trees","pre":["tree-traverse"],"cx":"O(n)","cue":"Height, diameter, balanced check, max path sum — child returns a summary; combine at the node, return a different value than you record.","c":0},{"id":"tree-bfs","n":"Level Order / BFS on Trees","g":"Trees","pre":["tree-traverse"],"cx":"O(n)","cue":"Level averages, right/left view, zigzag, min depth, width — queue processed one full level per iteration.","c":11},{"id":"tree-build","n":"Tree Construction from Traversals","g":"Trees","pre":["tree-traverse"],"cx":"O(n)","cue":"Build from pre+in or post+in — index map of inorder positions to split ranges in O(1).","c":3},{"id":"lca","n":"LCA & Binary Lifting","g":"Trees","pre":["tree-dfs-return"],"cx":"O(n log n) build, O(log n) query","cue":"Ancestor queries, distance between nodes, kth ancestor — up[k][v] jump table, or single-pass recursion for one-off LCA.","c":5},{"id":"bst","n":"BST Invariant & Search","g":"Trees","pre":["bsearch","tree-traverse"],"cx":"O(h)","cue":"Search/insert/delete/validate — left<node<right globally, so carry (min,max) bounds when validating.","c":0},{"id":"bst-inorder","n":"BST Inorder Exploitation","g":"Trees","pre":["bst"],"cx":"O(n)","cue":"Kth smallest, two swapped nodes, BST-to-DLL, predecessor/successor — inorder of a BST is sorted; keep a running counter or prev pointer.","c":45},{"id":"morris","n":"Morris Traversal (Threaded)","g":"Trees","pre":["tree-traverse"],"cx":"O(n), O(1) space","cue":"Inorder without stack or recursion — thread the rightmost node of the left subtree back to the current node, then undo.","c":0},{"id":"tree-dp","n":"DP on Trees","g":"Dynamic Programming","pre":["tree-dfs-return","dp-1d"],"cx":"O(n)","cue":"House robber on a tree, tree diameter, matching, subtree counts — dp[v][state] combined over children during postorder.","c":20},{"id":"rerooting","n":"Rerooting Technique","g":"Dynamic Programming","pre":["tree-dp"],"cx":"O(n)","cue":"Answer for *every* node as root — one postorder for subtree values, one preorder pushing the complement down.","c":1},{"id":"graph-bfs","n":"BFS & Shortest Path in Unweighted Graphs","g":"Graphs","pre":["tree-bfs"],"cx":"O(V+E)","cue":"Fewest steps/moves — BFS layer count is the distance; word ladder, knight moves, rotten oranges.","c":7},{"id":"graph-dfs","n":"DFS, Connectivity & Flood Fill","g":"Graphs","pre":["recursion"],"cx":"O(V+E)","cue":"Components, islands, flood fill, path existence — visited set plus recursion or explicit stack.","c":67},{"id":"multi-bfs","n":"Multi-Source BFS","g":"Graphs","pre":["graph-bfs"],"cx":"O(V+E)","cue":"'Distance to the nearest X' — push all sources into the queue at distance 0 simultaneously.","c":2},{"id":"bfs-01","n":"0-1 BFS / Deque Dijkstra","g":"Graphs","pre":["graph-bfs"],"cx":"O(V+E)","cue":"Edge weights only 0 and 1 (min obstacle removal, min flips) — deque: push-front on 0, push-back on 1.","c":0},{"id":"topo","n":"Topological Sort","g":"Graphs","pre":["graph-dfs"],"cx":"O(V+E)","cue":"Ordering with dependencies, course schedule, alien dictionary — Kahn's indegree BFS or DFS postorder reversed; cycle means no order.","c":8},{"id":"cycle-detect","n":"Cycle Detection","g":"Graphs","pre":["graph-dfs","topo"],"cx":"O(V+E)","cue":"Directed: colour/recursion-stack. Undirected: parent-aware DFS or union-find.","c":0},{"id":"dsu","n":"Union-Find (DSU)","g":"Graphs","pre":["graph-dfs"],"cx":"near O(1) per op","cue":"Dynamic connectivity, Kruskal, accounts merge, redundant connection — path compression plus union by size/rank.","c":4},{"id":"dsu-adv","n":"DSU Variants (Rollback, Weighted, Bipartite)","g":"Advanced Techniques","pre":["dsu"],"cx":"O(log n) per op","cue":"Offline queries in reverse, parity/weight to parent, or bipartite checking via 2n nodes.","c":0},{"id":"bipartite","n":"Bipartite Check & 2-Colouring","g":"Graphs","pre":["graph-bfs","dsu"],"cx":"O(V+E)","cue":"Possible-bipartition, conflict grouping — BFS colouring; odd cycle means impossible.","c":2},{"id":"dijkstra","n":"Dijkstra","g":"Graphs","pre":["graph-bfs","heap-topk"],"cx":"O(E log V)","cue":"Non-negative weighted shortest path, path with min effort, cheapest flights (with state) — priority queue plus dist relaxation.","c":3},{"id":"bellman","n":"Bellman-Ford & Negative Cycles","g":"Graphs","pre":["dijkstra"],"cx":"O(VE)","cue":"Negative edges, or 'at most k edges' — relax all edges V-1 times; an extra improving pass proves a negative cycle.","c":2},{"id":"floyd","n":"Floyd-Warshall","g":"Graphs","pre":["bellman"],"cx":"O(V^3)","cue":"All-pairs shortest paths on small V (<=400), transitive closure — k as the outermost loop.","c":1},{"id":"mst","n":"MST (Kruskal & Prim)","g":"Graphs","pre":["dsu","heap-topk"],"cx":"O(E log E)","cue":"Connect all nodes at minimum cost — Kruskal sorts edges with DSU; Prim grows from a node with a heap.","c":3},{"id":"scc","n":"Strongly Connected Components","g":"Advanced Graphs","pre":["topo","graph-dfs"],"cx":"O(V+E)","cue":"Mutual reachability, condensation DAG, 2-SAT — Kosaraju (two passes) or Tarjan (low-link, one pass).","c":1},{"id":"bridges","n":"Bridges & Articulation Points","g":"Advanced Graphs","pre":["graph-dfs"],"cx":"O(V+E)","cue":"Critical connections — DFS discovery times with low[] ; low[child]>disc[u] means bridge.","c":3},{"id":"flow","n":"Max Flow / Min Cut","g":"Advanced Graphs","pre":["graph-bfs"],"cx":"O(V E^2) Edmonds-Karp","cue":"Max throughput, min cut, vertex-disjoint paths — BFS augmenting paths on a residual graph.","c":0},{"id":"matching","n":"Bipartite Matching","g":"Advanced Graphs","pre":["flow","bipartite"],"cx":"O(V E)","cue":"Assignment of A to B with constraints — Hungarian/Kuhn augmenting paths, or reduce to max flow.","c":3},{"id":"euler","n":"Eulerian Path & Hierholzer","g":"Advanced Graphs","pre":["graph-dfs"],"cx":"O(E)","cue":"Use every edge exactly once (reconstruct itinerary) — degree conditions, then Hierholzer's stack.","c":1},{"id":"dp-1d","n":"1D Linear DP","g":"Dynamic Programming","pre":["recursion"],"cx":"O(n)","cue":"Climbing stairs, house robber, decode ways, jump game — dp[i] from a constant number of earlier states; write recursion, memoise, then tabulate.","c":60},{"id":"dp-grid","n":"Grid / 2D Path DP","g":"Dynamic Programming","pre":["dp-1d"],"cx":"O(mn)","cue":"Unique paths, min path sum, triangle, falling path — dp[i][j] from neighbours; usually compressible to one row.","c":15},{"id":"dp-knap","n":"0/1 Knapsack Family","g":"Dynamic Programming","pre":["dp-1d"],"cx":"O(n*W)","cue":"Subset sum, equal partition, target sum, count subsets — take/skip over (index, remaining capacity).","c":8},{"id":"dp-unbound","n":"Unbounded Knapsack Family","g":"Dynamic Programming","pre":["dp-knap"],"cx":"O(n*W)","cue const LAY={core:'A2Z + SDE',company:'Company high-frequency',cses:'CSES (CP foundations)',cf:'Codeforces ladder'};

function pass(p){
 if(F.q&&!p.hay.includes(F.q))return false;
 if(F.L.size&&!F.L.has(p.L))return false;
 if(F.d.size&&!F.d.has(p.d))return false;
 if(F.pat&&p.pat!==F.pat)return false;

 if(F.co.size&&![...F.co].some(c=>p.co&&p.co[c]))return false;

 if(F.stat==='todo'&&S.done[k])return false;

function gkey(p){
 if(F.gby==='pat')return[p.pat,(PT[p.pat]||{}).n||p.pat];
 if(F.gby==='grp')return[(PT[p.pat]||{}).g||'Other',(PT[p.pat]||{}).g||'Other'];
 if(F.gby==='d')return[p.d||'Unrated',p.d||'Unrated'];
 if(F.gby==='co'){const c=Object.keys(p.co||{});return c.length?[c[0],c[0]]:['_none','Not in the FAANG+ lists'];}
 if(p.L==='core')return['s'+p.s,p.s?p.s+'. '+STEP[p.s]:'Extra'];
 return[p.L+'|'+(p.tp||''),LAY[p.L]+(p.tp?' — '+p.tp:'')]}
function lks(p){let h='';
 if(p.lc)h+=`<a class="lk" target="_blank" rel="noopener" href="${p.lc}">LeetCode${p.lcid?' #'+p.lcid:''}${p.prem?' 🔒':''}</a>`;
 if(p.gfg)h+=`<a class="lk" target="_blank" rel="noopener" href="${p.gfg}">GfG</a>`;
 if(p.tuf)h+=`<a class="lk" target="_blank" rel="noopener" href="${p.tuf}">${p.L==='cses'?'CSES':p.L==='cf'?'Codeforces':'TUF'}</a>`;
 if(p.art)h+=`<a class="lk" target="_blank" rel="noopener" href="${p.art}">Article</a>`;

function head(gid,label,list){

 return h}
function render(){

 let h='';
 for(const[gid,g] of gs){h+=head(gid,g.l,g.a);

function stats(n){

render();
