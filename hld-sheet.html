--okbg:#15301f;--ez:#3fb98a;--me:#e0a94a;--hd:#f0736a;--chip:#222934;--star:#f0c23c}

<script>
const D={"meta":{"nodes":31,"cases":30,"solved":8},"nodes":[{"id":"perf-scale","n":"Performance vs Scalability","g":"Foundations","pre":[],"cue":"Performance = fast for one user. Scalability = stays fast as load grows. A system can be fast at low load and still not scale.","link":"https://github.com/donnemartin/system-design-primer/blob/master/README.md#performance-vs-scalability"},{"id":"lat-thr","n":"Latency vs Throughput","g":"Foundations","pre":[],"cue":"Latency = time for one request. Throughput = requests handled per unit time. Optimising one can hurt the other (batching raises throughput, adds latency).","link":"https://github.com/donnemartin/system-design-primer/blob/master/README.md#latency-vs-throughput"},{"id":"cap","n":"CAP Theorem","g":"Foundations","pre":["lat-thr"],"cue":"Under a network partition you must choose Consistency or Availability — you cannot have both plus partition tolerance. Frame every distributed-store choice through this.","link":"https://github.com/donnemartin/system-design-primer/blob/master/README.md#cap-theorem"},{"id":"consistency-pat","n":"Consistency Patterns","g":"Foundations","pre":["cap"],"cue":"Weak (may not see latest write), eventual (will converge given time), strong (always latest) — pick per field, not per system: usernames need strong, view counts can be eventual.","link":"https://github.com/donnemartin/system-design-primer/blob/master/README.md#consistency-patterns"},{"id":"availability-pat","n":"Availability Patterns","g":"Foundations","pre":["cap"],"cue":"Fail-over (active-passive/active-active) and replication are how you buy nines — know the '9s' table (99.9% = ~8.7h/yr down) cold.","link":"https://github.com/donnemartin/system-design-primer/blob/master/README.md#availability-patterns"},{"id":"dns","n":"DNS","g":"Networking","pre":[],"cue":"Translates domain to IP before anything else happens — also where you plug in geo-routing and weighted traffic splitting.","link":"https://github.com/donnemartin/system-design-primer/blob/master/README.md#domain-name-system"},{"id":"cdn","n":"CDN","g":"Networking","pre":["dns"],"cue":"Serve static (and increasingly dynamic) content from edge nodes near the user — push CDN (you upload) vs pull CDN (first request populates cache).","link":"https://github.com/donnemartin/system-design-primer/blob/master/README.md#content-delivery-network"},{"id":"load-balancer","n":"Load Balancer","g":"Networking","pre":["dns"],"cue":"Distributes traffic across servers — L4 (transport, fast, IP+port only) vs L7 (application, content-aware routing); enables horizontal scaling by removing the single-server bottleneck.","link":"https://github.com/donnemartin/system-design-primer/blob/master/README.md#load-balancer"},{"id":"reverse-proxy","n":"Reverse Proxy","g":"Networking","pre":["load-balancer"],"cue":"Sits in front of servers for SSL termination, compression, caching, and routing — a load balancer with one backend is basically a reverse proxy.","link":"https://github.com/donnemartin/system-design-primer/blob/master/README.md#reverse-proxy-web-server"},{"id":"app-layer","n":"Application Layer & Microservices","g":"Application","pre":["reverse-proxy"],"cue":"Separating the web layer from the app layer lets you scale each independently — microservices trade simplicity for independent scaling/deployment, at the cost of network calls and service discovery.","link":"https://github.com/donnemartin/system-design-primer/blob/master/README.md#application-layer"},{"id":"rdbms","n":"RDBMS","g":"Databases","pre":[],"cue":"Structured schema, ACID transactions, joins — the default until a specific requirement (scale, flexible schema, graph traversal) says otherwise.","link":"https://github.com/donnemartin/system-design-primer/blob/master/README.md#relational-database-management-system-rdbms"},{"id":"replication","n":"Replication (Master-Slave / Master-Master)","g":"Databases","pre":["rdbms"],"cue":"Copy data across nodes for read scaling and failover — master-slave (single write point, simple) vs master-master (multiple write points, conflict resolution needed).","link":"https://github.com/donnemartin/system-design-primer/blob/master/README.md#master-slave-replication"},{"id":"federation","n":"Federation","g":"Databases","pre":["replication"],"cue":"Split by function into multiple databases (users DB, products DB) — reduces read/write traffic per DB, no cross-DB joins.","link":"https://github.com/donnemartin/system-design-primer/blob/master/README.md#federation"},{"id":"sharding","n":"Sharding","g":"Databases","pre":["federation"],"cue":"Split one logical table across nodes by a shard key — this is the go-to answer whenever an interviewer says 'now assume 1 billion rows'.","link":"https://github.com/donnemartin/system-design-primer/blob/master/README.md#sharding"},{"id":"denorm","n":"Denormalization","g":"Databases","pre":["sharding"],"cue":"Duplicate data to avoid expensive joins after sharding — trades write complexity and storage for read speed.","link":"https://github.com/donnemartin/system-design-primer/blob/master/README.md#denormalization"},{"id":"nosql","n":"NoSQL Families","g":"Databases","pre":["rdbms"],"cue":"Key-value (Redis/DynamoDB), document (MongoDB), wide-column (Cassandra/BigTable), graph (Neo4j) — each optimises a different access pattern, not 'more scalable SQL'.","link":"https://github.com/donnemartin/system-design-primer/blob/master/README.md#nosql"},{"id":"sql-nosql","n":"SQL vs NoSQL Decision","g":"Databases","pre":["nosql","sharding"],"cue":"Choose SQL for relational integrity/joins/transactions; NoSQL for horizontal scale, flexible/evolving schema, or a specific access pattern (huge write volume, graph traversal).","link":"https://github.com/donnemartin/system-design-primer/blob/master/README.md#sql-or-nosql"},{"id":"cache","n":"Caching","g":"Performance","pre":["replication"],"cue":"Add a cache at every layer (client, CDN, web server, DB query, application object) — the single highest-leverage way to cut latency and DB load.","link":"https://github.com/donnemartin/system-design-primer/blob/master/README.md#cache"},{"id":"cache-invalid","n":"Cache Invalidation Strategies","g":"Performance","pre":["cache"],"cue":"Cache-aside (app manages it, lazy-loaded), write-through (write to cache+DB together, consistent but slower writes), write-behind (write to cache, async to DB, fast but riskier), refresh-ahead (pre-emptively refresh before expiry).","link":"https://github.com/donnemartin/system-design-primer/blob/master/README.md#when-to-update-the-cache"},{"id":"async","n":"Asynchronism & Message Queues","g":"Scaling Patterns","pre":["cache"],"cue":"Decouple slow work from the request path — message queues (task handed off, producer doesn't wait) and task queues (scheduled/background jobs); back-pressure protects the system when producers outpace consumers.","link":"https://github.com/donnemartin/system-design-primer/blob/master/README.md#asynchronism"},{"id":"comm-proto","n":"Communication Protocols (TCP/UDP/RPC/REST)","g":"Networking","pre":[],"cue":"TCP (reliable, ordered, connection-based) vs UDP (fast, no guarantee — video/gaming); RPC (function-call semantics, tighter coupling) vs REST (resource-based, cacheable, looser coupling).","link":"https://github.com/donnemartin/system-design-primer/blob/master/README.md#communication"},{"id":"rate-limit","n":"Rate Limiting","g":"Scaling Patterns","pre":["cache"],"cue":"Token bucket (bursty traffic allowed up to bucket size), leaky bucket (smooths to constant rate), fixed/sliding window counters — protects backends from abuse and cascading overload.","link":"https://stripe.com/blog/rate-limiters"},{"id":"consistent-hash","n":"Consistent Hashing","g":"Scaling Patterns","pre":["sharding","load-balancer"],"cue":"Adding/removing a node only remaps ~1/N of keys instead of all of them — the mechanism behind sharding, distributed caches, and CDN node selection at scale.","link":"https://github.com/donnemartin/system-design-primer/blob/master/README.md#sharding"},{"id":"security","n":"Security Basics","g":"Foundations","pre":["comm-proto"],"cue":"Encrypt in transit (TLS) and at rest, principle of least privilege, sanitize input against injection/XSS, rate-limit auth endpoints against brute force.","link":"https://github.com/donnemartin/system-design-primer/blob/master/README.md#security"},{"id":"object-storage","n":"Object Storage (Blob Storage)","g":"Databases","pre":[],"cue":"Large binary blobs (images, videos, backups, exports) don't belong in a relational row or NoSQL doc — store them in an object store (S3-style key→blob API) and keep only the reference/URL in your database; pair with a CDN for read-heavy delivery.","link":"https://www.hellointerview.com/learn/system-design/patterns/large-blobs"},{"id":"search-index","n":"Full-Text Search & Indexing","g":"Databases","pre":["nosql"],"cue":"'Search by keyword/relevance' across free-text fields isn't what a B-tree or even a NoSQL secondary index is built for — build an inverted index (Elasticsearch/Lucene-style) mapping terms to matching documents, ranked by relevance.","link":"https://www.hellointerview.com/learn/system-design/deep-dives/elasticsearch"},{"id":"realtime-push","n":"Real-Time Push (WebSockets / SSE / Long-Polling)","g":"Networking","pre":["comm-proto"],"cue":"Client needs to know about server-side changes without polling — WebSockets for bidirectional low-latency (chat, live updates), SSE for one-way server push (feeds/notifications), long-polling as a fallback when infra can't hold open sockets.","link":"https://www.hellointerview.com/learn/system-design/patterns/realtime-updates"},{"id":"consensus","n":"Distributed Consensus & Leader Election","g":"Scaling Patterns","pre":["replication"],"cue":"Multiple nodes must agree on one value or elect one leader despite failures — Raft/Paxos-style consensus (via ZooKeeper/etcd) prevents split-brain; reach for it for leader election, distributed locks, or cluster-wide config.","link":"https://www.hellointerview.com/learn/system-design/deep-dives/zookeeper"},{"id":"api-gateway","n":"API Gateway","g":"Application","pre":["app-layer"],"cue":"Single entry point in front of many services — handles auth, rate limiting, routing, request/response transformation and TLS termination in one place instead of every service reimplementing it.","link":"https://www.hellointerview.com/learn/system-design/deep-dives/api-gateway"},{"id":"idempotency","n":"Idempotency & Exactly-Once Processing","g":"Scaling Patterns","pre":["async"],"cue":"Client retries (timeout, network blip, double-click) must not double-charge, double-book, or double-send — attach a client-generated idempotency key, store the first outcome, and replay it on retry instead of re-executing.","link":"https://www.hellointerview.com/learn/system-design/patterns/dealing-with-contention"},{"id":"capacity-est","n":"Back-of-Envelope Capacity Estimation","g":"Foundations","pre":[],"cue":"Before drawing any boxes: convert requirements into QPS, storage/day, and bandwidth numbers — this is what separates 'sounds reasonable' from a design that actually holds up at the stated scale, and interviewers watch for it explicitly.","link":"https://www.hellointerview.com/learn/system-design/core-concepts/numbers-to-know"}],"cases":[{"slug":"pastebin","t":"Design Pastebin.com (or Bit.ly)","d":"Medium","pre":["sharding","rdbms","cache"],"link":"https://github.com/donnemartin/system-design-primer/blob/master/solutions/system_design/pastebin/README.md","solved":true},{"slug":"twitter","t":"Design the Twitter Timeline & Search (or Facebook Feed)","d":"Hard","pre":["sharding","cache","async","nosql"],"link":"https://github.com/donnemartin/system-design-primer/blob/master/solutions/system_design/twitter/README.md","solved":true},{"slug":"web-crawler","t":"Design a Web Crawler","d":"Hard","pre":["consistent-hash","async","nosql"],"link":"https://github.com/donnemartin/system-design-primer/blob/master/solutions/system_design/web_crawler/README.md","solved":true},{"slug":"mint","t":"Design Mint.com","d":"Medium","pre":["async","rdbms","security"],"link":"https://github.com/donnemartin/system-design-primer/blob/master/solutions/system_design/mint/README.md","solved":true},{"slug":"social-graph","t":"Design the Data Structures for a Social Network","d":"Hard","pre":["nosql","sharding"],"link":"https://github.com/donnemartin/system-design-primer/blob/master/solutions/system_design/social_graph/README.md","solved":true},{"slug":"kv-store","t":"Design a Key-Value Store for a Search Engine","d":"Hard","pre":["consistent-hash","nosql","replication"],"link":"https://github.com/donnemartin/system-design-primer/blob/master/solutions/system_design/query_cache/README.md","solved":true},{"slug":"sales-rank","t":"Design Amazon's Sales Ranking by Category","d":"Medium","pre":["async","cache","sharding"],"link":"https://github.com/donnemartin/system-design-primer/blob/master/solutions/system_design/sales_rank/README.md","solved":true},{"slug":"scaling-aws","t":"Design a System that Scales to Millions of Users on AWS","d":"Medium","pre":["load-balancer","cdn","cache","replication"],"link":"https://github.com/donnemartin/system-design-primer/blob/master/solutions/system_design/scaling_aws/README.md","solved":true},{"slug":"url-shortener","t":"Design a URL Shortener like TinyURL","d":"Easy","pre":["sharding","cache"],"link":"https://algomaster.io/learn/lld/design-url-shortener","solved":false},{"slug":"rate-limiter-sys","t":"Design an API Rate Limiter","d":"Medium","pre":["rate-limit"],"link":"https://www.hellointerview.com/learn/system-design/problem-breakdowns/distributed-rate-limiter","solved":false},{"slug":"whatsapp","t":"Design a Chat App like WhatsApp","d":"Hard","pre":["async","consistent-hash","comm-proto"],"link":"https://dev.to/karanpratapsingh/system-design-whatsapp-fld","solved":false},{"slug":"instagram","t":"Design a Picture-Sharing System like Instagram","d":"Hard","pre":["cdn","sharding","async"],"link":"https://algomaster.io/learn/system-design-interviews/design-instagram","solved":false},{"slug":"newsfeed","t":"Design the Facebook News Feed","d":"Hard","pre":["async","cache","nosql"],"link":"https://www.hellointerview.com/learn/system-design/problem-breakdowns/fb-news-feed","solved":false},{"slug":"dropbox","t":"Design a File Sync Service like Dropbox","d":"Hard","pre":["sharding","async","consistent-hash"],"link":"https://www.hellointerview.com/learn/system-design/problem-breakdowns/dropbox","solved":false},{"slug":"redis-kv","t":"Design a Distributed Key-Value Store like Redis","d":"Hard","pre":["nosql","consistent-hash","replication"],"link":"https://www.hellointerview.com/learn/system-design/deep-dives/redis","solved":false},{"slug":"memcached","t":"Design a Distributed Cache like Memcached","d":"Medium","pre":["cache","consistent-hash"],"link":"https://www.hellointerview.com/learn/system-design/problem-breakdowns/distributed-cache","solved":false},{"slug":"search-engine","t":"Design a Search Engine like Google","d":"Hard","pre":["sharding","async","nosql"],"link":"https://www.hellointerview.com/learn/system-design/problem-breakdowns/fb-post-search","solved":false},{"slug":"gdocs","t":"Design Google Docs (Collaborative Editing)","d":"Hard","pre":["async","consistency-pat"],"link":"https://www.hellointerview.com/learn/system-design/problem-breakdowns/google-docs","solved":false},{"slug":"snowflake","t":"Design a Distributed Unique ID Generator (Snowflake)","d":"Medium","pre":["sharding","consistent-hash"],"link":"https://blog.x.com/engineering/en_us/a/2010/announcing-snowflake","solved":false},{"slug":"trending","t":"Design a Trending-Topics System like Twitter's","d":"Medium","pre":["async","cache"],"link":"http://www.michael-noll.com/blog/2013/01/18/implementing-real-time-trending-topics-in-storm/","solved":false},{"slug":"recommend","t":"Design a Recommendation System like Amazon's","d":"Hard","pre":["async","nosql"],"link":"http://ijcai13.org/files/tutorial_slides/td3.pdf","solved":false},{"slug":"multidc","t":"Design a System Serving Data from Multiple Data Centers","d":"Hard","pre":["consistency-pat","availability-pat","dns"],"link":"http://highscalability.com/blog/2009/8/24/how-google-serves-data-from-multiple-datacenters.html","solved":false},{"slug":"stock-exchange","t":"Design a Stock Exchange like NASDAQ/Binance","d":"Hard","pre":["comm-proto","consistency-pat"],"link":"http://bhomnick.net/building-a-simple-limit-order-in-go/","solved":false},{"slug":"uber-ride-hailing","t":"Design Uber / Ride-Hailing Dispatch at Scale","d":"Hard","pre":["consistent-hash","sharding","realtime-push"],"link":"https://www.hellointerview.com/learn/system-design/problem-breakdowns/uber","solved":false},{"slug":"youtube-streaming","t":"Design YouTube / a Video Streaming Platform","d":"Hard","pre":["object-storage","cdn","sharding"],"link":"https://www.hellointerview.com/learn/system-design/problem-breakdowns/youtube","solved":false},{"slug":"ticketmaster","t":"Design Ticketmaster (Booking Under High Contention)","d":"Hard","pre":["idempotency","rdbms","rate-limit"],"link":"https://www.hellointerview.com/learn/system-design/problem-breakdowns/ticketmaster","solved":false},{"slug":"notification-system","t":"Design a Scalable Notification System","d":"Medium","pre":["async","idempotency"],"link":"https://www.hellointerview.com/learn/system-design/problem-breakdowns/notification-system","solved":false},{"slug":"payment-system","t":"Design a Payment Processing System","d":"Hard","pre":["idempotency","rdbms","consensus"],"link":"https://www.hellointerview.com/learn/system-design/problem-breakdowns/payment-system","solved":false},{"slug":"ad-click-aggregator","t":"Design an Ad Click Aggregator (Analytics Pipeline)","d":"Hard","pre":["async","sharding"],"link":"https://www.hellointerview.com/learn/system-design/problem-breakdowns/ad-click-aggregator","solved":false},{"slug":"job-scheduler","t":"Design a Distributed Job Scheduler","d":"Hard","pre":["consensus","async"],"link":"https://www.hellointerview.com/learn/system-design/problem-breakdowns/job-scheduler","solved":false}]},NODES={},K='hld-sheet-v1';
D.nodes.forEach(n=>NODES[n.id]=n);
const CAT_ORDER=['Foundations','Networking','Application','Databases','Performance','Scaling Patterns','Case Studies'];
let S={done:{},rev:{},open:{}};try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const F={q:'',stat:'',gby:'cat',node:''};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&lt;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const items=[];
D.nodes.forEach(n=>items.push({id:'n_'+n.id,t:n.n,d:'',cat:n.g,node:n.id,pre:[],link:n.link,desc:n.cue,
  hay:(n.n+' '+n.cue).toLowerCase()}));
D.cases.forEach((c,i)=>items.push({id:'c'+i,t:c.t,d:c.d,cat:'Case Studies',pre:c.pre,link:c.link,solved:c.solved,
  hay:(c.t+' '+c.pre.map(x=>(NODES[x]||{}).n||'').join(' ')).toLowerCase()}));
function pass(x){
 if(F.q&&!x.hay.includes(F.q))return false;
 if(F.node&&x.node!==F.node&&!(x.pre||[]).includes(F.node))return false;
 const k=x.id;
 if(F.stat==='done'&&!S.done[k])return false;
 if(F.stat==='todo'&&S.done[k])return false;
 if(F.stat==='rev'&&!S.rev[k])return false;
 return true}
function gkey(x){
 if(F.gby==='d')return[x.d||'Concept',x.d||'Concept'];
 if(F.gby==='node')return x.node?[x.node,x.t]:['_cases','Case Studies'];
 return[x.cat,x.cat]}
function nodeNote(nid){const n=NODES[nid];if(!n)return'';
 return `<div class="note"><b>${esc(n.cue)}</b>${n.link?` — <a class="lk" style="margin-left:4px" target="_blank" href="${n.link}">read</a>`:''}
 ${n.pre.length?`<div class="pre"><em>Learn first:</em>${n.pre.map(q=>`<button class="pl" data-j="${q}">${esc((NODES[q]||{}).n||q)}</button>`).join('')}</div>`:''}</div>`}
function render(){
 const vis=items.filter(pass),el=document.getElementById('list');
 if(!vis.length){el.innerHTML='<div class="empty">Nothing matches.</div>';stats(0);return}
 const gs=new Map();vis.forEach(x=>{const[k,l]=gkey(x);if(!gs.has(k))gs.set(k,{l,a:[]});gs.get(k).a.push(x)});
 const order=F.gby==='cat'?[...gs.keys()].sort((a,b)=>CAT_ORDER.indexOf(a)-CAT_ORDER.indexOf(b)):[...gs.keys()];
 let h='';
 for(const gid of order){const g=gs.get(gid);
  const all=items.filter(x=>gkey(x)[0]===gid),dn=all.filter(x=>S.done[x.id]).length,op=S.open[gid]!==false;
  h+=`<section class="grp"><div class="ghead" data-g="${esc(gid)}"><span>${op?'▾':'▸'}</span><h2>${esc(g.l)}</h2>
  <div class="mini"><i style="width:${all.length?dn/all.length*100:0}%"></i></div><small>${dn}/${all.length}</small></div>`;
  if(op){ if(F.gby==='node'&&NODES[gid]) h+=nodeNote(gid); h+='<div>';
   g.a.forEach(x=>{
    h+=`<div class="p${S.done[x.id]?' done':''}"><div class="phead"><input class="cb" type="checkbox" data-k="${x.id}"${S.done[x.id]?' checked':''}>
    <span class="ttl">${esc(x.t)}</span><button class="star" data-r="${x.id}" aria-pressed="${!!S.rev[x.id]}">★</button></div>
    <div class="tags" style="margin-left:25px">${x.d?`<span class="pill ${x.d}">${x.d}</span>`:''}
    ${x.node&&x.desc?'':''}${(x.pre||[]).map(pid=>`<button class="pill pat" data-j="${pid}">${esc((NODES[pid]||{}).n||pid)}</button>`).join('')}
    ${x.solved===false?'<span class="pill">reference article</span>':x.solved===true?'<span class="pill">worked solution</span>':''}</div>
    ${x.node&&x.desc?`<div class="req" style="margin-top:6px">${esc(x.desc)}</div>`:''}
    <div class="links">${x.link?`<a class="lk" target="_blank" href="${x.link}">${x.node?'Read':'Solution / reference'}</a>`:''}</div>
    </div>`});
   h+='</div>'}
  h+='</section>'}
 el.innerHTML=h;stats(vis.length)}
function stats(n){
 const dn=items.filter(x=>S.done[x.id]).length;
 document.getElementById('pb').style.width=(dn/items.length*100)+'%';
 document.getElementById('stats').innerHTML=`<span>Done <b>${dn}/${items.length}</b></span>
 <span>Building blocks <b>${D.meta.nodes}</b></span><span>Case studies <b>${D.meta.cases}</b></span>
 <span>Fully worked <b>${D.meta.solved}</b></span><span>Starred <b>${Object.values(S.rev).filter(Boolean).length}</b></span>
 ${n!==undefined?`<span>Showing <b>${n}</b></span>`:''}`}
document.getElementById('sub').textContent=`${D.meta.nodes} building blocks (DNS→CDN→load balancer→databases→caching→async→consistent hashing) with prerequisite chains, plus ${D.meta.cases} case studies — ${D.meta.solved} with fully worked solutions, the rest with primary-source reference architectures (engineering blogs, official write-ups).`;
document.getElementById('list').addEventListener('click',e=>{
 const j=e.target.closest('[data-j]');
 if(j){F.node=j.dataset.j;F.gby='node';document.getElementById('gby').value='node';S.open[F.node]=true;render();window.scrollTo({top:0});return}
 const hd=e.target.closest('.ghead');if(hd){const g=hd.dataset.g;S.open[g]=S.open[g]===false;save();render();return}
 const st=e.target.closest('.star');if(st){S.rev[st.dataset.r]=!S.rev[st.dataset.r];save();render()}});
document.getElementById('list').addEventListener('change',e=>{if(e.target.classList.contains('cb')){S.done[e.target.dataset.k]=e.target.checked;save();render()}});
document.getElementById('q').addEventListener('input',e=>{F.q=e.target.value.trim().toLowerCase();F.node='';render()});
document.getElementById('gby').addEventListener('change',e=>{F.gby=e.target.value;F.node='';render()});
document.getElementById('fstat').addEventListener('change',e=>{F.stat=e.target.value;render()});
document.getElementById('foot').innerHTML=`Building-block concepts sourced from donnemartin/system-design-primer (CC BY-SA); 8 case studies link to that repo's fully worked solutions, the remaining case studies link to the original architecture write-ups (company engineering blogs, primary sources) since no single repo has worked solutions for all of them. Approach every case study as: use cases & constraints → high-level design → deep-dive on the bottleneck → scale it, using the linked building blocks. Progress lives in this browser only.`;
render();
</script></body></html>
