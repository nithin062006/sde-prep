<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--fg:#14171f;--mut:#6b7280;--line:#e3e6ec;--acc:#7c3aed;--ok:#15803d;--okbg:#e9f6ed;
--ez:#0e7a5f;--me:#a86300;--hd:#c0392b;--chip:#eef1f6;--star:#e0a300}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1117;--card:#161b22;--fg:#e6edf3;--mut:#9099a6;
--line:#262d38;--acc:#a78bfa;--ok:#4ade80;--okbg:#15301f;--ez:#3fb98a;--me:#e0a94a;--hd:#f0736a;--chip:#222934;--star:#f0c23c}}
:root[data-theme="dark"]{--bg:#0e1117;--card:#161b22;--fg:#e6edf3;--mut:#9099a6;--line:#262d38;--acc:#a78bfa;--ok:#4ade80;
--okbg:#15301f;--ez:#3fb98a;--me:#e0a94a;--hd:#f0736a;--chip:#222934;--star:#f0c23c}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px 13px 80px}
a.back{color:var(--mut);font-size:12.5px;text-decoration:none}
h1{font-size:21px;margin:8px 0 2px;letter-spacing:-.3px}
.sub{color:var(--mut);font-size:12.5px;margin-bottom:12px}
.bar{height:9px;background:var(--chip);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc);width:0}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:9px 0 2px;font-size:12px;color:var(--mut)}.stats b{color:var(--fg)}
.ctrl{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding:9px 0 8px;border-bottom:1px solid var(--line);margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
input[type=search],select{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:14px;font-family:inherit}
input[type=search]{flex:1;min-width:160px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:99px;padding:5px 11px;font-size:12.5px;cursor:pointer;font-family:inherit}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.grp{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:10px;overflow:hidden}
.ghead{display:flex;gap:10px;align-items:center;padding:11px 13px;cursor:pointer;user-select:none}
.ghead h2{font-size:14.5px;margin:0;flex:1;font-weight:600}
.ghead small{color:var(--mut);font-size:11.5px;white-space:nowrap}
.mini{width:56px;height:6px;background:var(--chip);border-radius:99px;overflow:hidden;flex:none}.mini>i{display:block;height:100%;background:var(--ok)}
.note{font-size:12.5px;color:var(--mut);padding:0 13px 10px;border-bottom:1px solid var(--line);line-height:1.55}
.note b{color:var(--fg);font-weight:600}
.pre{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:5px}
.pre em{font-style:normal;font-size:11px;color:var(--mut)}
.pl{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;cursor:pointer;background:var(--chip);color:var(--fg)}
.p{padding:9px 13px;border-top:1px solid var(--line)}
.p.done{background:var(--okbg)}
.phead{display:flex;gap:8px;align-items:flex-start}
.cb{width:17px;height:17px;margin-top:3px;accent-color:var(--ok);flex:none;cursor:pointer}
.ttl{font-weight:500;font-size:14.5px;flex:1}.p.done .ttl{text-decoration:line-through;opacity:.6}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;align-items:center}
.pill{font-size:10.5px;border-radius:5px;padding:2px 6px;background:var(--chip);color:var(--mut);font-weight:600}
.Easy{color:var(--ez)}.Medium{color:var(--me)}.Hard{color:var(--hd)}
.pat{background:transparent;border:1px solid var(--acc);color:var(--acc);cursor:pointer;font-family:inherit}
.star{border:0;background:none;font-size:16px;cursor:pointer;color:var(--line);padding:2px;line-height:1;float:right}
.star[aria-pressed=true]{color:var(--star)}
.req{font-size:12.5px;color:var(--mut);margin:6px 0 0 25px;line-height:1.6}
.req li{margin-bottom:1px}
.links{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin:6px 0 0 25px}
.lk{font-size:11.5px;text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:3px 8px;color:var(--fg);background:var(--card);white-space:nowrap}
.lk:hover{border-color:var(--acc);color:var(--acc)}
.foot{color:var(--mut);font-size:11.5px;margin-top:16px;line-height:1.7}
.empty{padding:26px;text-align:center;color:var(--mut)}
@media(max-width:560px){.wrap{padding:13px 9px 70px}}

<script>
const D={"meta":{"total_problems":42,"gof":22,"oop":19,"concurrency":17},"nodes":[{"id":"class-obj","n":"Classes & Objects","g":"OOP Fundamentals","pre":[],"cue":"The basic unit: state (fields) + behaviour (methods) bundled together.","link":"https://algomaster.io/learn/lld/classes-and-objects"},{"id":"enums","n":"Enums","g":"OOP Fundamentals","pre":["class-obj"],"cue":"A fixed, type-safe set of named constants — use instead of raw strings/ints for closed categories (VehicleType, OrderStatus).","link":"https://algomaster.io/learn/lld/enums"},{"id":"interfaces","n":"Interfaces","g":"OOP Fundamentals","pre":["class-obj"],"cue":"A contract with no implementation — program against the interface, not the concrete class, so implementations can be swapped.","link":"https://algomaster.io/learn/lld/interfaces"},{"id":"encapsulation","n":"Encapsulation","g":"OOP Fundamentals","pre":["class-obj"],"cue":"Hide internal state behind methods; expose only what callers need. Prevents invalid state mutation from outside.","link":"https://algomaster.io/learn/lld/encapsulation"},{"id":"abstraction","n":"Abstraction","g":"OOP Fundamentals","pre":["interfaces"],"cue":"Expose *what* an object does, hide *how* — abstract classes/interfaces define the 'what'.","link":"https://algomaster.io/learn/lld/abstraction"},{"id":"inheritance","n":"Inheritance","g":"OOP Fundamentals","pre":["class-obj"],"cue":"'Is-a' relationship for code reuse — use sparingly, prefer composition when it's not a true is-a.","link":"https://algomaster.io/learn/lld/inheritance"},{"id":"polymorphism","n":"Polymorphism","g":"OOP Fundamentals","pre":["inheritance","interfaces"],"cue":"Same interface, different runtime behaviour per concrete type — the mechanism that makes Strategy/Factory/Template Method work.","link":"https://algomaster.io/learn/lld/polymorphism"},{"id":"assoc","n":"Association","g":"Class Relationships","pre":["class-obj"],"cue":"Two classes know about each other but neither owns the other's lifecycle (Driver drives Car).","link":"https://algomaster.io/learn/lld/association"},{"id":"aggr","n":"Aggregation","g":"Class Relationships","pre":["assoc"],"cue":"'Has-a' with independent lifecycles — Department has Professors, but Professors outlive the Department.","link":"https://algomaster.io/learn/lld/aggregation"},{"id":"comp","n":"Composition","g":"Class Relationships","pre":["assoc"],"cue":"'Has-a' with a shared lifecycle — Car has an Engine; destroy the Car, the Engine goes with it. Prefer over inheritance.","link":"https://algomaster.io/learn/lld/composition"},{"id":"dep","n":"Dependency","g":"Class Relationships","pre":["assoc"],"cue":"One class uses another temporarily (a method parameter or local variable) without holding a reference.","link":"https://algomaster.io/learn/lld/dependency"},{"id":"dry","n":"DRY — Don't Repeat Yourself","g":"Design Principles","pre":[],"cue":"Every piece of knowledge should have one authoritative representation — duplication is the thing to eliminate, not necessarily duplicated *code*.","link":"https://algomaster.io/learn/lld/dry"},{"id":"yagni","n":"YAGNI — You Aren't Gonna Need It","g":"Design Principles","pre":[],"cue":"Don't build for a hypothetical future requirement — interviewers penalise over-engineering as much as under-engineering.","link":"https://algomaster.io/learn/lld/yagni"},{"id":"kiss","n":"KISS — Keep It Simple","g":"Design Principles","pre":[],"cue":"The simplest design that satisfies the stated requirements wins — complexity must be justified by an actual requirement.","link":"https://algomaster.io/learn/lld/kiss"},{"id":"srp","n":"S — Single Responsibility","g":"SOLID","pre":["encapsulation"],"cue":"A class should have exactly one reason to change. Symptom of violation: 'and' in the class's job description.","link":"https://blog.algomaster.io/p/solid-principles-explained-with-code"},{"id":"ocp","n":"O — Open/Closed","g":"SOLID","pre":["polymorphism","srp"],"cue":"Open for extension, closed for modification — add new behaviour via a new class implementing an interface, not by editing existing switch/if chains.","link":"https://blog.algomaster.io/p/solid-principles-explained-with-code"},{"id":"lsp","n":"L — Liskov Substitution","g":"SOLID","pre":["inheritance","ocp"],"cue":"A subclass must be usable anywhere its parent is expected without breaking correctness — the classic violation is Square extends Rectangle.","link":"https://blog.algomaster.io/p/solid-principles-explained-with-code"},{"id":"isp","n":"I — Interface Segregation","g":"SOLID","pre":["interfaces","lsp"],"cue":"Many small, specific interfaces beat one fat interface — no client should be forced to implement methods it doesn't use.","link":"https://blog.algomaster.io/p/solid-principles-explained-with-code"},{"id":"dip","n":"D — Dependency Inversion","g":"SOLID","pre":["abstraction","isp"],"cue":"High-level modules should depend on abstractions, not concrete low-level classes — inject the interface, not the implementation.","link":"https://blog.algomaster.io/p/solid-principles-explained-with-code"},{"id":"singleton","n":"Singleton","g":"Creational","pre":["srp"],"cue":"Exactly one instance must exist system-wide (ParkingLot, ConfigManager, Logger, ConnectionPool) — private constructor + static accessor; make it thread-safe.","link":"https://algomaster.io/learn/lld/singleton"},{"id":"factory-method","n":"Factory Method","g":"Creational","pre":["ocp","polymorphism"],"cue":"Caller needs an object but the exact subclass is decided at runtime (create Car/Truck/Motorcycle from a type enum) — defer instantiation to a subclass/method.","link":"https://algomaster.io/learn/lld/factory-method"},{"id":"abstract-factory","n":"Abstract Factory","g":"Creational","pre":["factory-method"],"cue":"Need a *family* of related objects that must stay consistent with each other (UI theme: Button+Checkbox+Scrollbar per OS).","link":"https://algomaster.io/learn/lld/abstract-factory"},{"id":"builder","n":"Builder","g":"Creational","pre":["srp"],"cue":"An object has many optional fields/complex construction steps (building a Pizza, an HTTP request, a meal combo) — separate construction from representation, chain setters, call build().","link":"https://algomaster.io/learn/lld/builder"},{"id":"prototype","n":"Prototype","g":"Creational","pre":[],"cue":"Cloning an existing configured object is cheaper than constructing from scratch (game entity spawning, document templates).","link":"https://algomaster.io/learn/lld/prototype"},{"id":"adapter","n":"Adapter","g":"Structural","pre":["interfaces"],"cue":"Two incompatible interfaces must work together (legacy payment gateway vs new interface) — wrap the old interface behind the new one.","link":"https://algomaster.io/learn/lld/adapter"},{"id":"bridge","n":"Bridge","g":"Structural","pre":["abstraction","comp"],"cue":"Decouple an abstraction from its implementation so both can vary independently (Remote controls + Devices; Shape + Renderer).","link":"https://algomaster.io/learn/lld/bridge"},{"id":"composite","n":"Composite","g":"Structural","pre":["comp"],"cue":"Uniform treatment of individual objects and groups of objects in a tree (file system: File and Folder both 'have a size').","link":"https://algomaster.io/learn/lld/composite"},{"id":"decorator","n":"Decorator","g":"Structural","pre":["comp","srp"],"cue":"Add responsibilities to an object dynamically without subclass explosion (coffee + milk + sugar toppings, I/O stream wrapping).","link":"https://algomaster.io/learn/lld/decorator"},{"id":"facade","n":"Facade","g":"Structural","pre":["srp"],"cue":"Provide one simple interface over a complex subsystem of classes (a single `placeOrder()` hiding inventory+payment+shipping calls).","link":"https://algomaster.io/learn/lld/facade"},{"id":"flyweight","n":"Flyweight","g":"Structural","pre":[],"cue":"Massive number of similar objects — share the immutable intrinsic state (character glyphs in a text editor, tree types in a forest render).","link":"https://algomaster.io/learn/lld/flyweight"},{"id":"proxy","n":"Proxy","g":"Structural","pre":["interfaces"],"cue":"Control access to an object — lazy loading, access control, caching, or remote call — proxy implements the same interface as the real object.","link":"https://algomaster.io/learn/lld/proxy"},{"id":"observer","n":"Observer","g":"Behavioral","pre":["interfaces"],"cue":"One-to-many: when subject changes state, all dependents are notified automatically (pub-sub, stock ticker, event listeners, MVC view updates).","link":"https://algomaster.io/learn/lld/observer"},{"id":"strategy","n":"Strategy","g":"Behavioral","pre":["polymorphism","ocp"],"cue":"Interchangeable algorithms selected at runtime (sorting comparators, payment methods, route-calculation strategies) — inject the strategy, don't branch on type.","link":"https://algomaster.io/learn/lld/strategy"},{"id":"command","n":"Command","g":"Behavioral","pre":["encapsulation"],"cue":"Encapsulate a request as an object so it can be queued, logged, or undone (undo/redo stacks, job queues, remote-control buttons).","link":"https://algomaster.io/learn/lld/command"},{"id":"state","n":"State","g":"Behavioral","pre":["strategy"],"cue":"An object's behaviour changes with its internal state, and state transitions are explicit (order status, traffic light, TCP connection, vending machine).","link":"https://algomaster.io/learn/lld/state"},{"id":"template-method","n":"Template Method","g":"Behavioral","pre":["inheritance"],"cue":"An algorithm's skeleton is fixed but some steps vary by subclass (data-processing pipeline: read→process→save, where 'process' differs).","link":"https://algomaster.io/learn/lld/template-method"},{"id":"visitor","n":"Visitor","g":"Behavioral","pre":["polymorphism"],"cue":"Add new operations to a stable class hierarchy without modifying the classes (AST traversal, tax calculation across a heterogenous product catalogue).","link":"https://algomaster.io/learn/lld/visitor"},{"id":"mediator","n":"Mediator","g":"Behavioral","pre":["comp"],"cue":"Objects don't talk to each other directly; a mediator centralises the communication (chatroom, air-traffic control, UI dialog coordinating widgets).","link":"https://algomaster.io/learn/lld/mediator"},{"id":"memento","n":"Memento","g":"Behavioral","pre":["encapsulation"],"cue":"Capture and restore an object's internal state without violating encapsulation (undo history, save/checkpoint game state).","link":"https://algomaster.io/learn/lld/memento"},{"id":"chain","n":"Chain of Responsibility","g":"Behavioral","pre":["polymorphism"],"cue":"A request passes along a chain of handlers until one handles it (middleware pipelines, approval workflows, logging levels, exception handling chains).","link":"https://algomaster.io/learn/lld/chain-of-responsibility"},{"id":"iterator","n":"Iterator","g":"Behavioral","pre":["interfaces"],"cue":"Traverse a collection without exposing its internal representation (custom tree/graph traversal, paginated API result sets).","link":"https://algomaster.io/learn/lld/iterator"},{"id":"concur-intro","n":"Concurrency vs Parallelism","g":"Concurrency","pre":[],"cue":"Concurrency = structuring work as independent tasks; parallelism = literally running them at the same time on multiple cores. You can have one without the other.","link":"https://algomaster.io/learn/concurrency-interview/concurrency-vs-parallelism"},{"id":"proc-thread","n":"Processes vs Threads","g":"Concurrency","pre":["concur-intro"],"cue":"Processes have isolated memory; threads share the process's memory/heap — that shared memory is exactly why races and locks matter.","link":"https://algomaster.io/learn/concurrency-interview/processes-vs-threads"},{"id":"thread-life","n":"Thread Lifecycle & States","g":"Concurrency","pre":["proc-thread"],"cue":"New → Runnable → Running → Blocked/Waiting → Terminated — know which state a blocked lock-wait leaves a thread in.","link":"https://algomaster.io/learn/concurrency-interview/thread-lifecycle-and-states"},{"id":"race","n":"Race Conditions & Critical Sections","g":"Concurrency","pre":["thread-life"],"cue":"Multiple threads mutate shared state without synchronization and the outcome depends on timing — the critical section is the code that must run atomically.","link":"https://algomaster.io/learn/concurrency-interview/race-conditions-and-critical-sections"},{"id":"mutex","n":"Mutex","g":"Synchronization","pre":["race"],"cue":"Mutual exclusion lock — only one thread holds it at a time; used to protect a critical section.","link":"https://algomaster.io/learn/concurrency-interview/mutex"},{"id":"semaphore","n":"Semaphores","g":"Synchronization","pre":["mutex"],"cue":"A counter-based lock allowing N concurrent holders — generalises mutex (N=1) to bounded-resource pools (connection pools, rate limiters).","link":"https://algomaster.io/learn/concurrency-interview/semaphores"},{"id":"cond-var","n":"Condition Variables","g":"Synchronization","pre":["mutex"],"cue":"Let a thread sleep until another thread signals a condition changed — the mechanism under producer-consumer and blocking queues.","link":"https://algomaster.io/learn/concurrency-interview/condition-variables"},{"id":"locking-gran","n":"Coarse vs Fine-Grained Locking","g":"Synchronization","pre":["mutex"],"cue":"One big lock is simple but serializes everything; per-bucket/per-row locks scale better but risk more deadlocks and complexity.","link":"https://algomaster.io/learn/concurrency-interview/coarse-vs-fine-grained-locking"},{"id":"reentrant","n":"Reentrant Locks","g":"Synchronization","pre":["mutex"],"cue":"A thread that already holds the lock can re-acquire it without deadlocking itself — needed for recursive locking call chains.","link":"https://algomaster.io/learn/concurrency-interview/reentrant-locks"},{"id":"trylock","n":"Try-Lock & Timed Locking","g":"Synchronization","pre":["reentrant"],"cue":"Attempt to acquire without blocking forever — used to avoid deadlock or to fail fast under contention.","link":"https://algomaster.io/learn/concurrency-interview/try-lock-and-timed-locking"},{"id":"cas","n":"Compare-and-Swap (CAS)","g":"Synchronization","pre":["race"],"cue":"Atomic hardware instruction: swap only if the current value matches the expected value — foundation of lock-free data structures.","link":"https://algomaster.io/learn/concurrency-interview/compare-and-swap"},{"id":"deadlock","n":"Deadlock","g":"Concurrency Challenges","pre":["mutex"],"cue":"Circular wait on locks — four Coffman conditions; break one (usually lock ordering) to prevent it.","link":"https://algomaster.io/learn/concurrency-interview/deadlock"},{"id":"livelock","n":"Livelock","g":"Concurrency Challenges","pre":["deadlock"],"cue":"Threads keep changing state in response to each other but none make progress — unlike deadlock, they're not blocked, just stuck looping.","link":"https://algomaster.io/learn/concurrency-interview/livelock"},{"id":"signal-pat","n":"Signaling Pattern","g":"Concurrency Patterns","pre":["cond-var"],"cue":"One thread waits for a signal from another before proceeding — basis of FooBar/ZeroEvenOdd-style alternation problems.","link":"https://algomaster.io/learn/concurrency-interview/signaling-pattern"},{"id":"threadpool","n":"Thread Pool Pattern","g":"Concurrency Patterns","pre":["semaphore"],"cue":"Reuse a fixed set of worker threads pulling from a task queue instead of spawning a thread per task.","link":"https://algomaster.io/learn/concurrency-interview/thread-pool-pattern"},{"id":"prod-cons","n":"Producer-Consumer Pattern","g":"Concurrency Patterns","pre":["cond-var","threadpool"],"cue":"Producers push to a bounded queue, consumers pop — condition variables block producers when full and consumers when empty.","link":"https://algomaster.io/learn/concurrency-interview/producer-consumer-pattern"},{"id":"reader-writer","n":"Reader-Writer Pattern","g":"Concurrency Patterns","pre":["semaphore"],"cue":"Many concurrent readers are safe; a writer needs exclusive access — a reader-writer l hem","Users can search for questions based on keywords, tags, or user profiles","The system should assign reputation score to users based on their activity and the quality of their contributions","The system should handle concurrent access and ensure data consistency"],"pats":[],"doc":"https://github.com/ashishps1/awesome-low-level-design/blob/main/problems/stack-overflow.md","impls":[["Python","https://github.com/ashishps1/awesome-low-level-design/blob/main/solutions/python/stackoverflow"],["C++","https://github.com/ashishps1/awesome-low-level-design/blob/main/solutions/cpp/stackoverflow"],["C#","https://github.com/ashishps1/awesome-low-level-design/blob/main/solutions/csharp/stackoverflow"],["Go","https://github.com/ashishps1/awesome-low-level-design/blob/main/solutions/golang/stackOverFlow"]],"pat_ids":[]},{"slug":"task-management-system","t":"Design a Task Management System","d":"Easy","req":["The task management system should allow users to create, update, and delete tasks","Each task should have a title, description, due date, priority, and status (e.g., pending, in progress, completed)","Users should be able to assign tasks to other users and set reminders for tasks","The system should support searching and filtering tasks based on various criteria (e.g., priority, due date, assigned user)","Users should be able to mark tasks as completed and view their task history","The system should handle concurrent access to tasks and ensure data consistency","The system should be extensible to accommodate future enhancements and new features"],"pats":[],"doc":"https://github.com/ashishps1/awesome-low-level-design/blob/main/problems/task-management-system.md","impls":[["Python","https://github.com/ashishps1/awesome-low-level-design/blob/main/solutions/python/taskmanagementsystem"],["C++","https://github.com/ashishps1/awesome-low-level-design/blob/main/solutions/cpp/taskmanagementsystem"],["C#","https://github.com/ashishps1/awesome-low-level-design/blob/main/solutions/csh sible to support additional features and functionality"],"pats":[],"doc":"https://github.com/ashishps1/awesome-low-level-design/blob/main/problems/traffic-signal.md","impls":[],"pat_ids":[]},{"slug":"vending-machine","t":"Design a Vending Machine","d":"Easy","req":["The vending machine should support multiple products with different prices and quantities","The machine should accept coins and notes of different denominations","The machine should dispense the selected product and return change if necessary","The machine should keep track of the available products and their quantities","The machine should handle multiple transactions concurrently and ensure data consistency","The machine should provide an interface for restocking products and collecting money","The machine should handle exceptional scenarios, such as insufficient funds or out-of-stock products"],"pats":[],"doc":"https://github.com/ashishps1/awesome-low-level-design/blob/main/problems/vending-machine.md","impls":[["Python","https://github.com/ashishps1/awesome-low-level-design/blob/main/solutions/python/vendingmachine"],["C++","https://github.com/ashishps1/awesome-low-level-design/blob/main/solutions/cpp/vendingmachine"],["C#","https://github.com/ashishps1/awesome-low-level-design/blob/main/solutions/csharp/vendingmachine"],["Go","https://github.com/ashishps1/awesome-low-level-design/blob/main/solutions/golang/vendingmachine"]],"pat_ids":[]}],"cprobs":[{"slug":"foobar","t":"Print FooBar Alternately","d":"Easy","pre":["signal-pat"]},{"slug":"zeo","t":"Print Zero Even Odd","d":"Easy","pre":["signal-pat"]},{"slug":"fizzbuzz-mt","t":"Fizz Buzz Multithreaded","d":"Easy","pre":["signal-pat"]},{"slug":"h2o","t":"Building H2O Molecule","d":"Medium","pre":["semaphore","signal-pat"]},{"slug":"ttl-cache","t":"Design Thread-Safe Cache with TTL","d":"Medium","pre":["mutex","locking-gran"]},{"slug":"chashmap","t":"Design Concurrent HashMap","d":"Medium","pre":["locking-gran","reentrant"]},{"slug":"blockq","t":"Design Thread-Safe Blocking Queue","d":"Medium","pre":["cond-var","prod-cons"]},{"slug":"cbloom","t":"Design Concurrent Bloom Filter","d":"Hard","pre":["cas","locking-gran"]},{"slug":"mt-mergesort","t":"Multi-threaded Merge Sort","d":"Hard","pre":["threadpool"]}]},NODES={},K='lld-sheet-v1';
D.nodes.forEach(n=>NODES[n.id]=n);

let S={done:{},rev:{},open:{}};try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const F={q:'',stat:'',gby:'cat',node:''};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&lt;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const items=[];
D.problems.forEach((p,i)=>items.push({id:'p'+i,t:p.t,d:p.d,req:p.req,impls:p.impls,doc:p.doc,pat_ids:p.pat_ids,cat:'Problems',
  hay:(p.t+' '+p.pat_ids.map(x=>(NODES[x]||{}).n||'').join(' ')+' '+p.req.join(' ')).toLowerCase()}));
D.cprobs.forEach((p,i)=>items.push({id:'c'+i,t:p.t,d:p.d,req:[],impls:[],doc:'',pat_ids:p.pre,cat:'Concurrency Problems',
  hay:(p.t+' '+p.pre.map(x=>(NODES[x]||{}).n||'').join(' ')).toLowerCase()}));
D.nodes.forEach(n=>{ if(!items.find(x=>x.node===n.id)) items.push({id:'n_'+n.id,t:n.n,d:'',req:[],impls:[],doc:n.link,pat_ids:[],cat:n.g,node:n.id,hay:(n.n+' '+n.cue).toLowerCase()}); });
function pass(x){
 if(F.q&&!x.hay.includes(F.q))return false;
 if(F.node&&x.node!==F.node&&!(x.pat_ids||[]).includes(F.node))return false;
 const k=x.id;
 if(F.stat==='done'&&!S.done[k])return false;
 if(F.stat==='todo'&&S.done[k])return false;
 if(F.stat==='rev'&&!S.rev[k])return false;
 return true}
function gkey(x){
 if(F.gby==='d')return[x.d||'Concept',x.d||'Concept'];
 if(F.gby==='node')return x.node?[x.node,x.t]:['_probs','Practice Problems'];
 return[x.cat,x.cat]}
function nodeNote(nid){const n=NODES[nid];if(!n)return'';
 return `<div class="note"><b>${esc(n.cue)}</b>${n.link?` — <a class="lk" style="margin-left:4px" target="_blank" href="${n.link}">read</a>`:''}
 ${n.pre.length?`<div class="pre"><em>Learn first:</em>${n.pre.map(q=>`<button class="pl" data-j="${q}">${esc((NODES[q]||{}).n||q)}</button>`).join('')}</div>`:''}</div>`}
function render(){
 const vis=items.filter(pass),el=document.getElementById('list');
 if(!vis.length){el.innerHTML='<div class="empty">Nothing matches.</div>';stats(0);return}
 const gs=new Map();vis.forEach(x=>{const[k,l]=gkey(x);if(!gs.has(k))gs.set(k,{l,a:[]});gs.get(k).a.push(x)});
 const order=F.gby==='cat'?[...gs.keys()].sort((a,b)=>CAT_ORDER.indexOf(a)-CAT_ORDER.indexOf(b)):[...gs.keys()];
 let h='';
 for(const gid of order){const g=gs.get(gid);
  const all=items.filter(x=>gkey(x)[0]===gid),dn=all.filter(x=>S.done[x.id]).length,op=S.open[gid]!==false;
  h+=`<section class="grp"><div class="ghead" data-g="${esc(gid)}"><span>${op?'▾':'▸'}</span><h2>${esc(g.l)}</h2>
  <div class="mini"><i style="width:${all.length?dn/all.length*100:0}%"></i></div><small>${dn}/${all.length}</small></div>`;
  if(op){ if(F.gby==='node'&&NODES[gid]) h+=nodeNote(gid); h+='<div>';
   g.a.forEach(x=>{
    h+=`<div class="p${S.done[x.id]?' done':''}"><div class="phead"><input class="cb" type="checkbox" data-k="${x.id}"${S.done[x.id]?' checked':''}>

    <div class="tags" style="margin-left:25px">${x.d?`<span class="pill ${x.d}">${x.d}</span>`:''}
    ${(x.pat_ids||[]).map(pid=>`<button class="pill pat" data-j="${pid}">${esc((NODES[pid]||{}).n||pid)}</button>`).join('')}</div>
    ${x.req&&x.req.length?`<ul class="req">${x.req.slice(0,5).map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`:''}
    <div class="links">${x.doc?`<a class="lk" target="_blank" href="${x.doc}">Requirements & UML</a>`:''}${(x.impls||[]).map(([l,u])=>`<a class="lk" target="_blank" href="${u}">${esc(l)}</a>`).join('')}</div>
    </div>`});
   h+='</div>'}
  h+='</section>'}
 el.innerHTML=h;stats(vis.length)}
function stats(n){
 const dn=items.filter(x=>S.done[x.id]).length;
 document.getElementById('pb').style.width=(dn/items.length*100)+'%';
 document.getElementById('stats').innerHTML=`<span>Done <b>${dn}/${items.length}</b></span>
 <span>Design patterns <b>${D.meta.gof}</b></span><span>OOD problems <b>${D.problems.length}</b></span>
 <span>Concurrency problems <b>${D.cprobs.length}</b></span><span>Starred <b>${Object.values(S.rev).filter(Boolean).length}</b></span>
 ${n!==undefined?`<span>Showing <b>${n}</b></span>`:''}`}
document.getElementById('sub').textContent=`SOLID + 22 GoF design patterns with prerequisite chains, ${D.problems.length} OOD interview problems (Easy→Hard) with requirements, UML and multi-language reference implementations, plus concurrency fundamentals and ${D.cprobs.length} concurrency problems.`;
document.getElementById('list').addEventListener('click',e=>{
 const j=e.target.closest('[data-j]');
 if(j){F.node=j.dataset.j;F.gby='node';document.getElementById('gby').value='node';S.open[F.node]=true;render();window.scrollTo({top:0});return}
 const hd=e.target.closest('.ghead');if(hd){const g=hd.dataset.g;S.open[g]=S.open[g]===false;save();render();return}
 const st=e.target.closest('.star');if(st){S.rev[st.dataset.r]=!S.rev[st.dataset.r];save();render()}});

document.getElementById('foot').innerHTML=`Problems, requirements, UML diagrams and reference implementations sourced from ashishps1/awesome-low-level-design. Concepts (OOP, SOLID, GoF patterns, concurrency) link to algomaster.io. Click any pattern badge to jump to its concept node and prerequisite chain. Progress lives in this browser; it does not sync with the DSA sheet.`;
render();
